# Workspace build config.
# Keep builds reproducible & local: dedicated target dir per repo (shared target dirs across
# sibling repos can mix feature flags), conservative defaults. Sim determinism NEVER depends on
# build settings — but keeping them identical avoids "works locally, desync on CI" surprises.
[build]
target-dir = "target"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# Windows cross-build: pin mingw linker so cargo --target x86_64-pc-windows-gnu finds gcc.
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
