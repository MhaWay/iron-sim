[workspace]
members = ["crates/shared", "crates/game", "crates/server", "crates/client", "crates/render"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# Path deps on the iron-sim engine. Contract: docs/engine-api.md.
[workspace.dependencies]
engine-core = { path = "../engine/crates/core" }
engine-ecs = { path = "../engine/crates/ecs" }
engine-path = { path = "../engine/crates/path" }
fnv = "1"
