# Cargo settings for iron-sim rimworld-game.
# Keep determinism guarantees; do not change profile settings casually (they change codegen,
# not behavior, but keep releases reproducible).
[build]
target-dir = "target"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
# Windows cross-build: pin mingw linker so cargo --target x86_64-pc-windows-gnu finds gcc (mirrors rts-game).
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
